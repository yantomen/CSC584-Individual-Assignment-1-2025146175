
<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Form</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Personal Profile Form</h1>
        <p class="subtitle">Please fill in your personal information.</p>

        <form action="ProfileServlet" method="post">

            <label>Name:</label>
            <input type="text" name="name" required>

            <label>Student ID:</label>
            <input type="text" name="studentId" required>

            <label>Programme:</label>
            <input type="text" name="programme" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Hobbies:</label>
            <input type="text" name="hobbies" required>

            <label>Short Self-Introduction:</label>
            <textarea name="introduction" rows="5" required></textarea>

            <button type="submit">Submit Profile</button>

        </form>

    </div>

</body>
</html>
